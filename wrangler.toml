name = "skillforge-docs"
main = "src/main.py"
compatibility_date = "2026-09-30"
compatibility_flags = ["python_workers", "python_workflows"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "skillforge-docs"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "SKILLS"
bucket_name = "skillforge-skills"

[[workflows]]
name = "skillforge-crawl"
binding = "CRAWL_WORKFLOW"
class_name = "CrawlWorkflow"

[vars]
APP_NAME = "SkillForge Docs"
